<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividad 1.2. Comunicación con un API</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Conoce Austria</h1>

    <!-- API 1 -->
    <section>
      <h2>Información</h2>
      <div id="info-wikimedia"></div>
    </section>

    <!-- API 2 -->
    <section>
      <h2>Clima actual en Viena</h2>
      <div id="info-clima"></div>
    </section>

    <!-- API 3 -->
    <section>
      <h2>Moneda y tipo de cambio</h2>
      <div id="moneda-aus"></div>
      <label for="cantidad-euros"><strong>Cantidad en euros: </strong></label>
      <input type="number" id="cantidad-euros" value="1" min="0" />
      <button id="convertir">Convertir a pesos mexicanos</button>
      <p id="conversion"></p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
